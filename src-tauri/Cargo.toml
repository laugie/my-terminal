[package]
name = "my-terminal"
version = "0.1.0"
description = "Lightweight SSH client for macOS and Windows"
authors = ["laugie"]
edition = "2021"

[lib]
name = "my_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"

[profile.release]
codegen-units = 16
lto = false
opt-level = 2
panic = "abort"
strip = true
